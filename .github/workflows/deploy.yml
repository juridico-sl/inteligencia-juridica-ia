name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente protegido
        required: true
        type: choice
        options: [staging, production]
permissions:
  contents: read
jobs:
  migrate:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DB_PASSWORD }}", SUPABASE_PROJECT_REF: "${{ secrets.SUPABASE_PROJECT_REF }}" }
      - run: supabase db push --linked
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DB_PASSWORD }}" }
  deploy-web:
    needs: migrate
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deployment
        run: curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK"
        env: { VERCEL_DEPLOY_HOOK: "${{ secrets.VERCEL_DEPLOY_HOOK }}" }
